server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name marcosmateusconsorcio.com.br;

    return 301 https://www.marcosmateusconsorcio.com.br$request_uri;
}

server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name www.marcosmateusconsorcio.com.br _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
